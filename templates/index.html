<!DOCTYPE html>
<html>
<head>
    <title>Slot Booking</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            color: white;
            text-align: center;
        }

        h2 {
            margin-top: 30px;
            font-size: 30px;
            letter-spacing: 1px;
        }

        .container {
            width: 80%;
            margin: auto;
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .time {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .status {
            margin-bottom: 10px;
            font-weight: bold;
        }

        .available {
            color: #00ffcc;
        }

        .booked {
            color: #ff4d4d;
        }

        input {
            padding: 8px;
            border-radius: 8px;
            border: none;
            margin-bottom: 10px;
            width: 80%;
        }

        button {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        a {
            display: inline-block;
            margin-top: 30px;
            color: #ffd700;
            font-size: 18px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<h2>✨ Smart Slot Booking</h2>

<div class="container">
{% for slot in slots %}
    <div class="card">

        <div class="time">⏰ {{ slot.time_slot }}</div>

        {% if slot.is_booked %}
            <div class="status booked">❌ Booked</div>
        {% else %}
            <div class="status available">✅ Available</div>
        {% endif %}

        {% if not slot.is_booked %}
        <form method="POST" action="/book">
            <input type="hidden" name="slot_id" value="{{ slot.id }}">
            <input type="text" name="user_name" placeholder="Your Name" required>
            <br>
            <button type="submit">Book Now</button>
        </form>
        {% endif %}

    </div>
{% endfor %}
</div>

<a href="/booked">📌 View Booked Slots</a>

</body>
</html>
